<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaine Pet</title><style>body{font:18px system-ui;background:#f4f6fb;text-align:center;padding:2rem;color:#17203a}img{width:288px;height:312px;object-fit:contain}select{font:inherit;padding:.5rem;border-radius:8px}main{max-width:600px;margin:auto;background:white;padding:2rem;border-radius:24px}</style><main><h1>Kaine</h1><p>Luffy-style animated companion</p><img id="pet" src="assets/gifs/idle.gif" alt="Kaine animation"><p><label>Animation <select id="state"></select></label></p><p>Transparent PNG frames and the atlas are included for use in other apps.</p></main><script>const states=['idle','running-right','running-left','waving','jumping','failed','waiting','running','review'];for(const s of states){const o=document.createElement('option');o.value=s;o.textContent=s.replaceAll('-',' ');state.appendChild(o)}state.onchange=()=>pet.src='assets/gifs/'+state.value+'.gif';</script></html>
